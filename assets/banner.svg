<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Dynamic Flow Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #a5b4fc;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    /* Dynamic Wave Motion Animation */
    @keyframes waveMotion {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-15px) scaleY(1.05); }
      100% { transform: translateY(0px) scaleY(1); }
    }
    /* Dynamic Pulse Animation */
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    /* Scanning Line Animation */
    @keyframes scanLine {
      0% { transform: translateX(-1000px); }
      100% { transform: translateX(1200px); }
    }
    .animated-wave-1 {
      animation: waveMotion 8s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-wave-2 {
      animation: waveMotion 12s ease-in-out infinite reverse;
      transform-origin: center;
    }
    .pulsing-grid {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .scanner {
      animation: scanLine 6s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16" />

  <!-- Background Cyber Grid (Pulsing, in background behind text) -->
  <g class="pulsing-grid" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- Dynamic Waves (Strictly in Background) -->
  <g opacity="0.4">
    <path class="animated-wave-1" fill="none" stroke="url(#line-grad)" stroke-width="3" d="M-100,260 Q150,180 400,250 T900,200 T1300,280" />
    <path class="animated-wave-2" fill="none" stroke="url(#line-grad)" stroke-width="2" d="M-100,290 Q200,220 500,280 T1000,210 T1300,290" opacity="0.6" />
  </g>

  <!-- Ambient Glow Orbs in background -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="270" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Scanning laser effect across background -->
  <rect class="scanner" x="0" y="0" width="200" height="350" fill="url(#line-grad)" opacity="0.15" />

  <!-- Shield Icon Graphic (Right Side Foreground) -->
  <g transform="translate(920, 85)" filter="url(#glow)">
    <path d="M90 10 L170 40 V100 C170 155 135 205 90 220 C45 205 10 155 10 100 V40 Z" fill="none" stroke="url(#accent-grad)" stroke-width="4" opacity="0.8" />
    <path d="M90 30 L150 52.5 V100 C150 142.5 124 180 90 192.5 C56 180 30 142.5 30 100 V52.5 Z" fill="#1e1b4b" opacity="0.6" />
    <!-- Checkmark inside Shield -->
    <path d="M65 100 L82 117 L115 80" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND TEXT CONTENT (High contrast, clearly visible) -->
  <!-- Tag / Pill -->
  <g transform="translate(80, 75)">
    <rect width="280" height="28" rx="14" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="19" class="badge-text">🛡️ AI GOVERNANCE &amp; GRC</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="155" class="title">Awesome AI Risk Management Platform</text>

  <!-- Subtitle -->
  <text x="80" y="200" class="subtitle">Curated SaaS Platforms, Enterprise Model Risk Management &amp; Open-Source Risk Controls</text>

  <!-- Bottom Accent Bar -->
  <rect x="80" y="235" width="450" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Tech Badges Footer -->
  <g transform="translate(80, 265)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
      <tspan fill="#38bdf8">●</tspan> EU AI Act Aligned  
      <tspan fill="#a855f7" dx="15">●</tspan> NIST AI RMF  
      <tspan fill="#ec4899" dx="15">●</tspan> Model Security &amp; Bias Audit
    </text>
  </g>
</svg>
